<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einkaufsliste</title>
<link rel="stylesheet" th:href="@{/style.css}"
	href="../static/style.css">
</head>
<body>
	<nav>
		<a href=#list>Einkaufsliste</a> <a th:href="@{/(focus)} + '#name' ">Artikel hinzufügen</a>
	</nav>
	<main>
		<h1 id="list">Einkaufsliste</h1>
		<table>
			<thead>
				<tr>
					<th scope="col">Aktionen</th>
					<th scope="col">Artikel</th>
					<th scope="col">Menge</th>
					<th scope="col">Menge ändern</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item : ${shoppingList}" th:id="'item-' + ${item.id}">
					<td>
						<form method="post" th:action="@{/check/{id}(id=${item.id})}"
							th:unless="${item.completed}">
							<button type="submit" aria-label="Als erledigt markieren">&#x2714</button>
						</form>
						<form method="post" th:action="@{/delete/{id}(id=${item.id})}"
							th:if="${item.completed}">
							<button type="submit" aria-label="Endgültig löschen">&#x1F5D1</button>
						</form>
						<form method="post" th:action="@{/reset/{id}(id=${item.id})}"
							th:if="${item.completed}">
							<button type="submit" aria-label="Wiederherstellen">&#x21BA</button>
						</form>
					</td>
					<td th:classappend="${item.completed} ? 'done' : '' "
						th:text="${item.name}">Brot</td>
					<td th:classappend="${item.completed} ? 'done' : '' "
						th:text="${item.demand}">2</td>
					<td>
						<form method="post"
							th:action="@{/item/{id}/decrease(id=${item.id})}"
							th:unless="${item.completed}">
							<button type="submit" aria-label="Menge um eins reduzieren">-</button>
						</form>
						<form method="post"
							th:action="@{/item/{id}/increase(id=${item.id})}"
							th:unless="${item.completed}">
							<button type="submit" th:disabled="${item.demand == 9999}"
								aria-label="Menge um eins erhöhen">+</button>
						</form>
					</td>
				</tr>
				<tr th:if="${#lists.isEmpty(shoppingList)}">
					<td colspan="4">Kein Einkauf notwendig &#x1F389</td>
				</tr>
			</tbody>
		</table>
		<h1 id="add">Artikel hinzufügen</h1>
		<form class="add" method="post" th:action="@{/}"
			th:object="${shoppingListItem}">
			<label for="name">Name:</label> <input id="name" th:field="*{name}"
				th:autofocus="${param.focus != null}"
				maxlength="50" required aria-describedby="name-error"> <span
				id="name-error" class="error" th:errors="*{name}"></span> <label
				for="demand">Bedarf:</label> <input id="demand" type="number"
				th:field="*{demand}" min="1" max="9999" required
				aria-describedby="demand-error"> <span id="demand-error"
				class="error" th:errors="*{demand}"></span>
			<button type="submit" aria-label="Artikel hinzufügen">Hinzufügen</button>
		</form>
	</main>
	<nav>
		<a href=#list>Zurück zum Listenanfang</a>
	</nav>
</body>
</html>
