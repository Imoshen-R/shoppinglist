<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einkaufsliste</title>
<link rel="stylesheet" th:href="@{/style.css}"
	href="../static/style.css">
</head>
<body>
	<nav>
		<a href=#list>Einkaufsliste</a> <a href=#add>Artikel hinzufügen</a>
	</nav>
	<main>
		<ul>
			<li><a href=#list>Einkaufsliste</a></li>
			<li><a href=#add>Artikel hinzufügen</a></li>
		</ul>
		<h1 id="list">Einkaufsliste</h1>
		<table>
			<thead>
				<tr>
					<th scope="col">Aktionen</th>
					<th scope="col">Artikel</th>
					<th scope="col">Menge</th>
					<th scope="col">Menge ändern</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item : ${shoppingList}">
					<td><button type="submit">&#x2714</button><button type="submit">&#x1F5D1</button> <button type="submit">&#x21BA</button> </td>
					<td th:text="${item.name}">Brot</td>
					<td th:text="${item.demand}">2</td>
					<td><button type="submit">-</button><button type="submit">+</button></td>
				</tr>
				<tr th:if="${#lists.isEmpty(shoppingList)}">
					<td colspan="4">Kein Einkauf notwendig &#x1F389</td>
				</tr>
			</tbody>
		</table>
		<h1 id="add">Artikel hinzufügen</h1>
		<form method="post" th:action="@{/}" th:object="${shoppingListItem}">
			<label for="name">Name</label> <input id="name" th:field="*{name}"
				maxlength="100" required aria-describedby="name-error"> <span
				id="name-error" class="error" th:errors="*{name}"></span> <label
				for="demand">Bedarf</label> <input id="demand" type="number"
				th:field="*{demand}" min="1" required
				aria-describedby="demand-error"> <span id="demand-error"
				class="error" th:errors="*{demand}"></span>
			<button type="submit">+</button>
		</form>
		<p>
			Das getrennte Servlet-Beispiel liefert unter <a href="/list">/list</a>
			eine feste JSON-Antwort.
		</p>
	</main>
</body>
</html>
